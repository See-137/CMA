# CMA CI Pipeline
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.16.9"
      - run: ruff check backend/
      - run: ruff format --check backend/

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest --tb=short -q

  migrations:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cma
          POSTGRES_USER: cma
          POSTGRES_PASSWORD: cma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMA_DATABASE_URL: postgresql://cma:cma@localhost:5432/cma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what Alembic + the model metadata need — keeps this job fast.
      - run: pip install "alembic>=1.13" "sqlalchemy>=2.0.23,<2.1" "psycopg2-binary>=2.9" "pydantic-settings>=2.1"
      - name: Apply migrations on Postgres
        run: cd backend && alembic upgrade head
      - name: Verify migrations are reversible
        run: cd backend && alembic downgrade base && alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install --ignore-scripts
      - run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, migrations, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cma-backend ./backend
      - run: docker build -t cma-frontend ./frontend
