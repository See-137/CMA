services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cma
      POSTGRES_USER: cma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - cma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # Bound to loopback: put a reverse proxy (or an SSH tunnel) in front for
    # remote access. /api/v1/setup is unauthenticated until the wizard runs,
    # so a fresh instance must never be reachable from the network.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/app/data/chroma
    environment:
      - CMA_DATABASE_URL=postgresql://cma:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cma
      - CMA_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - CMA_CHROMA_PERSIST_DIR=/app/data/chroma
      - CMA_LLM_PROVIDER=ollama
      - CMA_LLM_MODEL=llama3
      - CMA_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Metrics-scoped credential for the Prometheus scraper (optional —
      # unset means /metrics accepts the API key only). The same value
      # must be written to deploy/prometheus/metrics-token.
      - CMA_METRICS_TOKEN=${CMA_METRICS_TOKEN:-}
      # Only the frontend's X-Forwarded-For is trusted (see backend/Dockerfile).
      - FORWARDED_ALLOW_IPS=172.28.0.10
    networks:
      - cma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready: explicit readiness contract — Postgres hard-fails
      # (urlopen raises on 503), vector store degrades without failing.
      # Replaces the accidental readiness probe of /api/v1/setup/status.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First probe pays lazy ChromaDB client init on top of app startup.
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    networks:
      cma:
        ipv4_address: 172.28.0.10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Observability rig — opt-in: docker compose --profile observability up -d
  # Prometheus scrapes the backend's auth-gated /metrics with the
  # metrics-scoped token; Grafana auto-provisions the CMA dashboard.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - prom-data:/prometheus
    networks:
      - cma
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.9
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Compose interpolates this even when the profile is off, so it cannot be
      # required. Port 3000 is loopback-only; set CMA_GRAFANA_PASSWORD in .env
      # before exposing Grafana any further.
      - GF_SECURITY_ADMIN_PASSWORD=${CMA_GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cma
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  cma:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pg-data:
  chroma-data:
  prom-data:
  grafana-data:
