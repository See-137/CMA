services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cma
      POSTGRES_USER: cma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cma_dev_password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - chroma-data:/app/data/chroma
    environment:
      - CMA_DATABASE_URL=postgresql://cma:${POSTGRES_PASSWORD:-cma_dev_password}@postgres:5432/cma
      - CMA_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - CMA_CHROMA_PERSIST_DIR=/app/data/chroma
      - CMA_LLM_PROVIDER=ollama
      - CMA_LLM_MODEL=llama3
      - CMA_OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready: explicit readiness contract — Postgres hard-fails
      # (urlopen raises on 503), vector store degrades without failing.
      # Replaces the accidental readiness probe of /api/v1/setup/status.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First probe pays lazy ChromaDB client init on top of app startup.
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  chroma-data:
