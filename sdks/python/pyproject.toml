[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cma-cost-monitor"
version = "0.1.0"
description = "Python SDK for Cost Monitoring Agent - track LLM costs in multi-agent systems"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.8.0"]
langchain = ["langchain-core>=0.1.0"]
all = ["openai>=1.0.0", "anthropic>=0.8.0", "langchain-core>=0.1.0"]
# openai/anthropic: the instrumentation tests exercise the real SDKs
# against a local fake server — collection fails without them.
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "openai>=1.26", "anthropic>=0.8.0"]

[tool.pytest.ini_options]
# Transport tests spin real threads (worker + fake HTTP server) around retry
# loops — a wrong Event.wait()/join means a silent hang, not a fast failure.
timeout = 30
