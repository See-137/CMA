<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>CMA architecture</title>
  <desc>LLM apps send events via the Python SDK to FastAPI ingestion, which writes to a SQL database and a ChromaDB vector cache. The Scrooge RAG engine reads both plus an LLM to answer questions, surfaced in a React dashboard and a streaming chat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th{font-size:14px;font-weight:600;}
      .ts{font-size:12px;font-weight:400;}
      .arr{stroke:#888780;stroke-width:1.5;fill:none;}
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="524" fill="#ffffff"/>

  <text class="th" x="340" y="30" text-anchor="middle" fill="#2C2C2A" font-size="16">CMA — Cost Monitoring Agent</text>
  <text class="ts" x="340" y="50" text-anchor="middle" fill="#5F5E5A">LLM cost observability with a RAG assistant</text>

  <!-- Row 1: SDK (neutral) -->
  <rect x="180" y="76" width="320" height="50" rx="12" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text class="th" x="340" y="100" text-anchor="middle" fill="#2C2C2A">Python SDK (auto-instrument)</text>
  <text class="ts" x="340" y="118" text-anchor="middle" fill="#5F5E5A">OpenAI · Anthropic · LangChain</text>

  <line class="arr" x1="340" y1="126" x2="340" y2="150" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="142" text-anchor="start" fill="#5F5E5A">POST /api/v1/events</text>

  <!-- Row 2: ingestion (blue) -->
  <rect x="160" y="152" width="360" height="52" rx="12" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="340" y="176" text-anchor="middle" fill="#042C53">FastAPI ingestion</text>
  <text class="ts" x="340" y="194" text-anchor="middle" fill="#185FA5">Auto-discover agents · cost · budgets</text>

  <line class="arr" x1="320" y1="204" x2="225" y2="230" marker-end="url(#arrow)"/>
  <line class="arr" x1="360" y1="204" x2="455" y2="230" marker-end="url(#arrow)"/>

  <!-- Row 3: storage (blue) -->
  <rect x="110" y="232" width="210" height="58" rx="12" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="215" y="257" text-anchor="middle" fill="#042C53">SQL database</text>
  <text class="ts" x="215" y="275" text-anchor="middle" fill="#185FA5">Source of truth</text>
  <rect x="360" y="232" width="210" height="58" rx="12" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="th" x="465" y="257" text-anchor="middle" fill="#042C53">ChromaDB</text>
  <text class="ts" x="465" y="275" text-anchor="middle" fill="#185FA5">Vector cache · async</text>

  <line class="arr" x1="225" y1="290" x2="305" y2="318" marker-end="url(#arrow)"/>
  <line class="arr" x1="455" y1="290" x2="375" y2="318" marker-end="url(#arrow)"/>

  <!-- Row 4: Scrooge (amber) -->
  <rect x="160" y="320" width="360" height="58" rx="12" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="th" x="340" y="345" text-anchor="middle" fill="#412402">Scrooge — RAG engine</text>
  <text class="ts" x="340" y="363" text-anchor="middle" fill="#854F0B">Intent → SQL + vectors → LLM</text>

  <line class="arr" x1="320" y1="378" x2="225" y2="406" marker-end="url(#arrow)"/>
  <line class="arr" x1="360" y1="378" x2="455" y2="406" marker-end="url(#arrow)"/>

  <!-- Row 5: outputs (neutral) -->
  <rect x="110" y="408" width="210" height="56" rx="12" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text class="th" x="215" y="432" text-anchor="middle" fill="#2C2C2A">React dashboard</text>
  <text class="ts" x="215" y="450" text-anchor="middle" fill="#5F5E5A">Recharts · live polling</text>
  <rect x="360" y="408" width="210" height="56" rx="12" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text class="th" x="465" y="432" text-anchor="middle" fill="#2C2C2A">Scrooge chat</text>
  <text class="ts" x="465" y="450" text-anchor="middle" fill="#5F5E5A">SSE stream + citations</text>

  <!-- Legend -->
  <rect x="196" y="492" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
  <text class="ts" x="214" y="502" text-anchor="start" fill="#5F5E5A">Data pipeline</text>
  <rect x="356" y="492" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="ts" x="374" y="502" text-anchor="start" fill="#5F5E5A">AI / RAG layer</text>
</svg>
